services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbpdb}
      POSTGRES_USER: ${POSTGRES_USER:-rbpdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rbpdb}
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rbpdb}:${POSTGRES_PASSWORD:-rbpdb}@db:5432/${POSTGRES_DB:-rbpdb}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbpdb}
      POSTGRES_USER: ${POSTGRES_USER:-rbpdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rbpdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
