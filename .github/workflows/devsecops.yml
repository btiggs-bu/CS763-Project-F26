#AI Contribution Weight: [50%] AI Generated / [50%] Human Refactored
name: DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: rbpdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rbpdb
    
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: python -m ruff check .
        continue-on-error: true

      - name: Verify Application Imports
        run: |
          python -c "from app.main import app"
      
      - name: Verify PostgreSQL Connectivity
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_isready -h localhost -p 5432 -U postgres

      - name: Run Tests
        run: python -m pytest

  semgrep:
    name: Semgrep Security Scan
    needs: build
    runs-on: ubuntu-latest
    
    # Required for Semgrep to upload findings to GitHub Security Tab (SARIF)
    permissions:
      security-events: write
      actions: read
      contents: read

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Run Semgrep Scan
        run: semgrep scan --config auto --sarif --output=semgrep.sarif

      - name: Upload SARIF file for GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          sarif_file: semgrep.sarif
        if: always() # Upload results even if vulnerabilities are found

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0        # Disabling shallow clones is recommended for improving the relevancy of reporting
      
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: Trivy Security Scan
    needs: sonarqube
    runs-on: ubuntu-latest
    
    # Required for Trivy to upload findings to GitHub Security Tab (SARIF)
    permissions:
      security-events: write
      actions: read
      contents: read   
    
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Build Docker Image
        run: |
          docker build -t rbpdb .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: rbpdb
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: 0
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always() # Upload results even if vulnerabilities are found