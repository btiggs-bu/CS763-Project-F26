#AI Contribution Weight: [80%] AI Generated / [20%] Human Refactored
name: DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Application Imports
        run: |
          python -c "from app.main import app"

      - name: Build Docker Image
        run: |
          docker build -t rbpdb .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rbpdb
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: 0
      
      - name: Upload Trivy scan results to GitHub Security tab
        # Required for Trivy to upload findings to GitHub Security Tab (SARIF)
        permissions:
          security-events: write
          actions: read
          contents: read    
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always() # Upload results even if vulnerabilities are found

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    
    # Required for Semgrep to upload findings to GitHub Security Tab (SARIF)
    permissions:
      security-events: write
      actions: read
      contents: read

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: semgrep scan --config auto --sarif --output=semgrep.sarif

      - name: Upload SARIF file for GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always() # Upload results even if vulnerabilities are found