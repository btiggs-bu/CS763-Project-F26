#AI Contribution Weight: [80%] AI Generated / [20%] Human Refactored
name: DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Application Imports
        run: |
          python -c "from app.main import app"

  semgrep:
    name: Semgrep Security Scan
    needs: build
    runs-on: ubuntu-latest
    
    # Required for Semgrep to upload findings to GitHub Security Tab (SARIF)
    permissions:
      security-events: write
      actions: read
      contents: read

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Run Semgrep Scan
        run: semgrep scan --config auto --sarif --output=semgrep.sarif

      - name: Upload SARIF file for GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          sarif_file: semgrep.sarif
        if: always() # Upload results even if vulnerabilities are found

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0        # Disabling shallow clones is recommended for improving the relevancy of reporting
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 #v8.4.1
        env:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: Trivy Security Scan
    needs: sonarqube
    runs-on: ubuntu-latest
    
    # Required for Trivy to upload findings to GitHub Security Tab (SARIF)
    permissions:
      security-events: write
      actions: read
      contents: read   
    
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Build Docker Image
        run: |
          docker build -t rbpdb .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: rbpdb
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: 0
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always() # Upload results even if vulnerabilities are found